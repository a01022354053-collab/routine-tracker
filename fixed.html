<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>고정 지출 · 일상 매니저</title>
  <meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17171c" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/toss/tossface@v1.6.1/dist/tossface.css">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .placeholder { display: grid; justify-items: center; gap: 14px; padding-block: 40px; }
    .placeholder .tile { width: 64px; height: 64px; border-radius: 20px; font-size: 34px; }
  </style>

<body>
  <main class="wrap">
    <section class="card placeholder">
      <span class="tile"><span class="emoji" aria-hidden="true">🧾</span></span>
      <p class="empty">아직 비어 있어요</p>
    </section>
  </main>
  <script src="assets/app.js"></script>
  <script>mountTopbar('fixed');</script>

</html>
