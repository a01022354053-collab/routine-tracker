<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>일상 매니저</title>
  <meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17171c" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/toss/tossface@v1.6.1/dist/tossface.css">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .cal-card { padding: 14px 14px 12px; }
    .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 6px 6px 0; }
    .mcal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .mcal .wd { text-align: center; font-size: 12px; font-weight: 600; color: var(--text-3); padding: 6px 0 6px; }
    .mcal button { position: relative; height: 46px; display: grid; place-items: center; border-radius: 12px; }
    .mcal button:disabled { cursor: default; }
    .mcal .n {
      width: 34px; height: 34px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 15px; font-weight: 600; color: var(--text-2);
      transition: background .15s, color .15s;
    }
    .mcal button.today .n { color: var(--blue); font-weight: 800; }
    .mcal button[aria-pressed="true"] .n { background: var(--blue); color: var(--on-blue); }
    .mcal button:not([aria-pressed="true"]):active .n { background: var(--press); }
    .mcal .dot { position: absolute; bottom: 2px; width: 5px; height: 5px; border-radius: 50%; }
    .dot.full { background: var(--blue); }
    .dot.part { background: color-mix(in srgb, var(--blue) 45%, var(--card)); }
    .dot.plan { background: var(--line); box-shadow: inset 0 0 0 1.5px var(--text-3); }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card cal-card" aria-label="달력">
      <div class="cal-head">
        <div class="monthnav">
          <button id="prev" aria-label="이전 달"></button>
          <b id="calTitle" class="num"></b>
          <button id="next" aria-label="다음 달"></button>
        </div>
        <span class="pill num" id="calRate" hidden></span>
      </div>
      <div class="mcal" id="cal"></div>
    </section>

    <div class="sec-head">
      <h2 id="selTitle"></h2>
      <p class="date" id="selDate"></p>
    </div>
    <section class="card" id="sel"><p class="empty">불러오는 중…</p></section>

    <div id="tomorrowBox" hidden>
      <div class="sec-head">
        <h2>내일 할 일</h2>
        <p class="date" id="tomorrowDate"></p>
      </div>
      <section class="card" id="tomorrow" style="margin-top: 12px"></section>
    </div>
  </main>

  <script src="assets/app.js"></script>
  <script>
    mountTopbar('today');
    document.getElementById('prev').innerHTML = ICON.prev;
    document.getElementById('next').innerHTML = ICON.next;

    const now = new Date();
    const todayKey = keyOf(now);
    const rel = { [keyOf(addDays(now, -1))]: '어제', [todayKey]: '오늘', [keyOf(addDays(now, 1))]: '내일' };
    let y = now.getFullYear(), m = now.getMonth(), sel = todayKey, DAYS = [], loaded = false;
    const byDate = () => Object.fromEntries(DAYS.map(d => [d.date, d]));

    function renderCal() {
      const map = byDate();
      document.getElementById('calTitle').textContent = `${y}년 ${m + 1}월`;
      const st = monthStats(DAYS, y, m), pill = document.getElementById('calRate');
      pill.hidden = st.rate == null;
      pill.textContent = `달성률 ${st.rate}%`;

      const lead = (new Date(y, m, 1).getDay() + 6) % 7, last = new Date(y, m + 1, 0).getDate();
      let html = ['월', '화', '수', '목', '금', '토', '일'].map(w => `<span class="wd">${w}</span>`).join('');
      for (let i = 0; i < lead; i++) html += '<span></span>';
      for (let d = 1; d <= last; d++) {
        const k = `${y}-${pad(m + 1)}-${pad(d)}`, rec = map[k];
        let dot = '', label = dayLabel(k);
        if (rec && rec.checked) {
          const r = rateOf(rec);
          dot = `<i class="dot ${r >= 100 ? 'full' : 'part'}"></i>`;
          label += ` 달성률 ${r}%`;
        } else if (rec) {
          dot = '<i class="dot plan"></i>';
          label += ' 할 일 있음';
        }
        html += `<button class="${k === todayKey ? 'today' : ''}" data-k="${k}" aria-pressed="${k === sel}" aria-label="${label}"><span class="n num">${d}</span>${dot}</button>`;
      }
      const cal = document.getElementById('cal');
      cal.innerHTML = html;
      cal.querySelectorAll('button').forEach(b => (b.onclick = () => { sel = b.dataset.k; render(); }));
    }

    function renderSel() {
      const map = byDate();
      document.getElementById('selTitle').textContent = `${rel[sel] || '그날'} 할 일`;
      document.getElementById('selDate').textContent = dayLabel(sel);
      if (loaded) document.getElementById('sel').innerHTML = dayCardHTML(map[sel]);

      const tk = keyOf(addDays(parseKey(sel), 1)), tmr = map[tk];
      const show = sel === todayKey && tmr && (tmr.todos || []).length;
      document.getElementById('tomorrowBox').hidden = !show;
      if (show) {
        document.getElementById('tomorrowDate').textContent = dayLabel(tk);
        document.getElementById('tomorrow').innerHTML = dayCardHTML(tmr);
      }
    }

    function render() { renderCal(); renderSel(); }
    const shift = n => { m += n; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } renderCal(); };
    document.getElementById('prev').onclick = () => shift(-1);
    document.getElementById('next').onclick = () => shift(1);

    render();
    loadDays().then(d => { DAYS = d; loaded = true; render(); }).catch(() => {
      document.getElementById('sel').innerHTML = '<p class="empty">기록을 불러오지 못했어요. 새로고침해 주세요.</p>';
    });
  </script>
</body>
</html>
