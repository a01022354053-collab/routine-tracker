<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>일상 매니저</title>
  <meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17171c" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/toss/tossface@v1.6.1/dist/tossface.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="wrap">
    <p class="brand">일상 매니저</p>

    <div>
      <p class="date" id="todayDate"></p>
      <h1>오늘 할 일</h1>
    </div>
    <section class="card" id="today"><p class="empty">불러오는 중…</p></section>

    <div id="tomorrowBox" hidden>
      <div class="sec-head">
        <h2>내일 할 일</h2>
        <p class="date" id="tomorrowDate"></p>
      </div>
      <section class="card" id="tomorrow" style="margin-top: 12px"></section>
    </div>

    <a class="card month-link" id="month" href="archive.html" hidden>
      <span class="label" id="monthLabel"></span>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="value num" id="monthValue"></span>
      <span class="bar"><i id="monthBar"></i></span>
    </a>
  </main>

  <footer class="tabbar">
    <nav aria-label="메뉴">
      <a class="tab" href="./" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" rx="4" stroke="currentColor" stroke-width="2"/><path d="M8.5 9.5l1.6 1.6 3-3.2M8.5 15h7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        오늘
      </a>
      <a class="tab" href="archive.html">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="4" width="17" height="5" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5 9v8a3 3 0 003 3h8a3 3 0 003-3V9M10 13h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        저장소
      </a>
    </nav>
  </footer>

  <script src="assets/app.js"></script>
  <script>
    const now = new Date();
    const todayKey = keyOf(now), tomorrowKey = keyOf(addDays(now, 1));
    document.getElementById('todayDate').textContent = dayLabel(todayKey);

    function todayCard(day) {
      if (!day) return '<p class="empty">등록된 할 일이 없어요</p>';
      const todos = day.todos || [];
      const rate = rateOf(day);
      if (!todos.length) {
        return `<div class="summary">${ringHTML(rate)}<div><div class="big">${esc(day.memo || (day.checked ? `${rate}% 달성` : '등록된 할 일이 없어요'))}</div></div></div>`;
      }
      const done = todos.filter(t => t.done).length;
      const sub = day.checked ? '체크 완료' : done === todos.length ? '모두 끝냈어요' : `${todos.length - done}개 남았어요`;
      return `<div class="summary">${ringHTML(rate)}<div><div class="big num">${todos.length}개 중 ${done}개 완료</div><div class="sub">${sub}</div></div></div>${tasksHTML(todos)}`;
    }

    loadDays().then(days => {
      document.getElementById('today').innerHTML = todayCard(days.find(d => d.date === todayKey));

      const tmr = days.find(d => d.date === tomorrowKey);
      if (tmr && (tmr.todos || []).length) {
        document.getElementById('tomorrowDate').textContent = dayLabel(tomorrowKey);
        document.getElementById('tomorrow').innerHTML = tasksHTML(tmr.todos);
        document.getElementById('tomorrowBox').hidden = false;
      }

      const st = monthStats(days, now.getFullYear(), now.getMonth());
      document.getElementById('monthLabel').textContent = `${now.getMonth() + 1}월 달성률 · 기록 ${st.count}일`;
      document.getElementById('monthValue').textContent = st.rate == null ? '아직 기록 없음' : `${st.rate}%`;
      document.getElementById('monthBar').style.width = `${st.rate ?? 0}%`;
      document.getElementById('month').hidden = false;
    }).catch(() => {
      document.getElementById('today').innerHTML = '<p class="empty">기록을 불러오지 못했어요. 새로고침해 주세요.</p>';
    });
  </script>
</body>
</html>
