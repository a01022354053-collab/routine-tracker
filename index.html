<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>루틴 트래커</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
  <style>
    :root { --bg: #fbfbfa; --fg: #1d1f1e; --font: "Gowun Dodum", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141615; --fg: #ecedeb; color-scheme: dark } }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--fg);
      display: grid; place-items: center;
      padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
      font-family: var(--font);
    }
    h1 { margin: 0; font-weight: 400; font-size: clamp(2.5rem, 10vw, 5rem); letter-spacing: 0.02em; }
  </style>
</head>
<body>
  <h1>안녕</h1>
</body>
</html>
